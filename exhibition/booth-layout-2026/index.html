<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>2026 대구국제기계산업대전 부스 배치도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#1e3a8a;
    --primary-dark:#152a63;
    --accent:#2563eb;
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#111827;
    --muted:#6b7280;
    --border:#e5e7eb;
    --chip:#eef2ff;
    --p-fill:#d6ebd9; --p-line:#70c49c; --p-ink:#0a7a55;
    --d-fill:#fdeef5; --d-line:#de85b8; --d-ink:#a21d6b;
    --l-fill:#fdf9d6; --l-line:#fdb875;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; height:100%; overflow:hidden; overscroll-behavior:none;}
  body{
    font-family:'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    background:var(--bg); color:var(--text);
    -webkit-tap-highlight-color:transparent;
  }
  .app{display:flex; flex-direction:column; height:100vh; height:100dvh;}
  header.top{
    flex:0 0 auto;
    background:linear-gradient(135deg, var(--primary), var(--primary-dark));
    color:#fff; padding:12px 14px 10px;
    box-shadow:0 2px 10px rgba(0,0,0,.15); position:relative; z-index:30;
  }
  header.top h1{margin:0; font-size:17px; font-weight:900; letter-spacing:-0.2px;}
  header.top p{margin:3px 0 0; font-size:12px; opacity:.85; font-weight:500;}
  .search-wrap{position:relative; margin-top:9px;}
  .search-wrap input{
    width:100%; font:inherit; font-size:16px; padding:9px 34px 9px 12px; border-radius:10px;
    border:1px solid rgba(255,255,255,.35); background:#fff; color:var(--text); outline:none;
  }
  .search-wrap input:focus{border-color:#93c5fd; box-shadow:0 0 0 3px rgba(147,197,253,.4);}
  .search-wrap .clear{
    position:absolute; right:4px; top:50%; transform:translateY(-50%); width:32px; height:32px;
    border:none; background:none; color:#9ca3af; font-size:20px; cursor:pointer; display:none;
  }
  .sugg{
    position:absolute; left:0; right:0; top:calc(100% + 4px); background:#fff; color:var(--text);
    border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.25); max-height:46vh; overflow-y:auto; display:none;
  }
  .sugg button{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left; border:none; background:none;
    padding:9px 12px; font:inherit; font-size:13.5px; cursor:pointer; border-bottom:1px solid var(--border);
  }
  .sugg button:last-child{border-bottom:none;}
  .sugg button:active, .sugg button:hover{background:var(--chip);}
  .sugg .sn{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500;}
  .zbadge{
    flex:0 0 auto; font-size:11px; font-weight:800; padding:2px 7px; border-radius:6px; letter-spacing:.2px;
    background:var(--chip); color:var(--primary);
  }
  .zbadge.P{background:#e1f2e6; color:var(--p-ink);}
  .zbadge.D{background:#fde4f0; color:var(--d-ink);}
  .zbadge.L{background:#fdf3c4; color:#92600a;}

  .zonebar{
    flex:0 0 auto; display:flex; gap:6px; padding:7px 10px; background:var(--bg);
    border-bottom:1px solid var(--border); overflow-x:auto;
  }
  .zonebar button{
    flex:1 1 0; white-space:nowrap; border:1px solid var(--border); background:#fff; color:var(--muted);
    padding:6px 8px; border-radius:10px; font:inherit; font-size:11.5px; font-weight:700; cursor:pointer;
  }
  .zonebar button i{display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:5px; vertical-align:-1px; border:1px solid;}
  .zonebar button.P i{background:var(--p-fill); border-color:var(--p-line);}
  .zonebar button.D i{background:var(--d-fill); border-color:var(--d-line);}
  .zonebar button.A i{background:#fff; border-color:#94a3b8;}

  #mapwrap{flex:1 1 auto; min-height:0; position:relative; background:#eef1f7; touch-action:none; overflow:hidden; cursor:grab;}
  #mapwrap.drag{cursor:grabbing;}
  svg#map{display:block; width:100%; height:100%; user-select:none; -webkit-user-select:none;}
  .map-btns{position:absolute; right:8px; bottom:8px; display:flex; flex-direction:column; gap:6px; z-index:5;}
  .map-btns button{
    width:38px; height:38px; border-radius:10px; border:1px solid var(--border); background:rgba(255,255,255,.95);
    font:inherit; font-size:19px; font-weight:700; color:var(--primary); cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.15);
  }
  .map-btns button.txt{font-size:11px; font-weight:800;}
  .hint{
    position:absolute; left:50%; top:10px; transform:translateX(-50%); z-index:5; pointer-events:none;
    background:rgba(17,24,39,.78); color:#fff; font-size:11.5px; padding:6px 12px; border-radius:999px; white-space:nowrap;
    transition:opacity .6s;
  }
  .hint.off{opacity:0;}

  /* SVG */
  .hall-bg{fill:#fff; stroke:none;}
  .wall{stroke:#94a3b8; stroke-width:1.2; fill:none;}
  .c{stroke-width:.55; transition:fill .15s;}
  .z-P .c{fill:var(--p-fill); stroke:var(--p-line);}
  .z-D .c{fill:var(--d-fill); stroke:var(--d-line);}
  .z-L .c{fill:var(--l-fill); stroke:var(--l-line);}
  .b{cursor:pointer;}
  .b:hover .c{filter:brightness(.96);}
  .code{font-size:5.6px; font-weight:500; fill:#1f2328; text-anchor:middle; pointer-events:none;}
  .nm{font-size:3.3px; font-weight:500; fill:#374151; text-anchor:middle; pointer-events:none; display:none;}
  .nm.big{font-size:5.2px; font-weight:700; display:block;}
  svg.zoomed .nm{display:block;}
  .zt{font-weight:900; fill:#1e3a8a; font-size:12.5px;}
  .zs{font-size:7.5px; fill:#4b5563; font-weight:500;}
  .zt.P{fill:var(--p-ink);} .zt.D{fill:var(--d-ink);}
  .ent-i{fill:#94a3b8;}
  .ent-t{font-size:6.5px; font-weight:700; fill:#64748b; text-anchor:middle;}
  .ent.sel .ent-i{fill:var(--accent);}
  .ent.sel .ent-t{fill:var(--accent); font-size:7.5px; font-weight:900;}
  .gap{stroke:var(--bg); stroke-width:2;}

  .sel-fill{fill:rgba(37,99,235,.2); stroke:#1d4ed8; stroke-width:1.8; stroke-linejoin:round; pointer-events:none;}
  .sel-ring{fill:none; stroke:#2563eb; stroke-width:1.6; pointer-events:none; transform-box:fill-box; transform-origin:center; animation:ring 1.5s ease-out infinite;}
  @keyframes ring{0%{opacity:.9; transform:scale(1);} 100%{opacity:0; transform:scale(1.35);}}
  .route-case{fill:none; stroke:#fff; stroke-width:4.8; stroke-linejoin:round; stroke-linecap:round; opacity:.95;}
  .route-line{fill:none; stroke:#2563eb; stroke-width:2.4; stroke-linejoin:round; stroke-linecap:butt;}
  .route-flow{fill:none; stroke:#fff; stroke-width:.9; stroke-dasharray:1.6 4; stroke-linecap:round; stroke-linejoin:round; animation:flow .9s linear infinite;}
  @keyframes flow{to{stroke-dashoffset:-5.6;}}
  .start-dot{fill:#2563eb; stroke:#fff; stroke-width:1.2;}
  @media (prefers-reduced-motion:reduce){ .sel-ring,.route-flow{animation:none;} }

  /* 하단 안내 */
  .sheet{
    flex:0 0 auto; background:var(--card); border-top:1px solid var(--border); padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 14px rgba(0,0,0,.08); min-height:104px; position:relative; z-index:10;
  }
  .sheet .idle{font-size:12.5px; color:var(--muted); line-height:1.65;}
  .sheet .idle b{color:var(--text);}
  .sheet .links{display:flex; flex-wrap:wrap; gap:6px; margin-top:7px;}
  .sheet .links a, .sheet .links button{
    flex:1 1 auto; text-align:center; text-decoration:none; font:inherit; font-size:12.5px; font-weight:700;
    padding:8px 8px; border-radius:10px; border:1px solid #c7d5f5; background:#f4f7ff; color:var(--accent); cursor:pointer;
  }
  .sheet .links button.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  .sh-top{display:flex; align-items:flex-start; gap:9px;}
  .sh-top .zbadge{font-size:14px; padding:3px 9px; margin-top:1px;}
  .sh-name{flex:1; min-width:0;}
  .sh-name b{display:block; font-size:15px; font-weight:800; line-height:1.35; word-break:keep-all;}
  .sh-name small{display:block; font-size:11.5px; color:var(--muted); line-height:1.4; margin-top:1px; word-break:break-word;}
  .sh-x{flex:0 0 auto; border:none; background:#f3f4f6; color:#6b7280; width:30px; height:30px; border-radius:50%; font-size:16px; cursor:pointer;}
  .sh-route{margin-top:7px; font-size:12.5px; color:#1e40af; font-weight:700;}
  .sh-route span{color:var(--muted); font-weight:500;}
  .note{margin-top:6px; font-size:10.5px; color:#9ca3af; line-height:1.5;}
  .toast{
    position:absolute; left:50%; bottom:14px; transform:translateX(-50%); background:rgba(17,24,39,.9); color:#fff;
    font-size:12.5px; padding:8px 14px; border-radius:10px; z-index:8; display:none; max-width:90%; text-align:center;
  }
</style>
</head>

/* ---------- 지도 그리기 ---------- */
function wrapText(s, perLine, maxLines){
  const chars = Array.from(s), lines = [];
  const n = Math.ceil(chars.length / perLine);
  if (n > 1 && n <= maxLines) perLine = Math.ceil(chars.length / n);   // 줄 길이를 고르게(마지막 줄에 한 글자만 남지 않도록)
  for (let i = 0; i < chars.length && lines.length < maxLines; i += perLine) lines.push(chars.slice(i, i + perLine).join(''));
  if (chars.length > perLine * maxLines){
    const last = Array.from(lines[maxLines - 1]);
    last.splice(Math.max(1, perLine - 1)); lines[maxLines - 1] = last.join('') + '…';
  }
  return lines;
}
function nameBlock(b){
  const name = b.n.map(x => x[0]).join(' / ');
  if (!name || b.p) return '';
  const area = b.w * b.h, big = area >= 1500;
  if (!big && !(area >= 480 && b.w >= 22)) return '';
  const fs = big ? 5.2 : 3.3, lh = fs * 1.2;
  const perLine = Math.max(2, Math.floor((b.w - 3) / (fs * (big ? 1.0 : 0.98))));
  const lx = b.l[0], ly = b.l[1], y0 = b.y, y1 = b.y + b.h;
  const availBelow = y1 - (ly + 4.2) - 1, availAbove = (ly - 4.2) - y0 - 1;
  let start, maxLines, below = true;
  if (availBelow >= availAbove){ maxLines = Math.floor(availBelow / lh); start = ly + 4.2; }
  else { maxLines = Math.floor(availAbove / lh); below = false; }
  if (maxLines < 1) return '';
  const lines = wrapText(name, perLine, maxLines);
  if (!below) start = (ly - 4.2) - lines.length * lh;
  const cx = b.x + b.w / 2;
  return lines.map((t, i) => `<text class="nm${big ? ' big' : ''}" x="${cx}" y="${(start + lh * (i + 0.8)).toFixed(1)}">${esc(t)}</text>`).join('');
}
function shapeEl(b, cls){
  if (b.p) return `<polygon class="${cls}" points="${b.p.map(p => p.join(',')).join(' ')}"/>`;
  return `<rect class="${cls}" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}"/>`;
}

  const ext = z => { let a = 1e9, b = -1e9; for (const k in BOOTHS){ const v = BOOTHS[k]; if (v.z === z || (z === 'P' && v.z === 'L')){ a = Math.min(a, v.x); b = Math.max(b, v.x + v.w); } } return [a, b]; };
  const [pa, pb] = ext('P'), [da, db] = ext('D');

  // 벽 (하단은 출입구 3곳 개방)
  const gaps = D.ent.map(e => [e.x - 13, e.x + 13]);

      + `<text class="ent-t" x="${x}" y="${y + 36}">출입구 ${e.id}</text></g>`;

}

let W = 1, H = 1, view = {cx:(BOUNDS.x0 + BOUNDS.x1) / 2, cy:(BOUNDS.y0 + BOUNDS.y1) / 2, w:BOUNDS.x1 - BOUNDS.x0};
const scaleOf = () => W / view.w;     // 화면 px / 지도 단위
const vhOf = () => view.w * H / W;
function clampView(v){
  const bw = BOUNDS.x1 - BOUNDS.x0, bh = BOUNDS.y1 - BOUNDS.y0;
  const maxW = Math.max(bw * 1.08, bh * 1.08 * W / H);
  v.w = Math.min(maxW, Math.max(W / 11, v.w));
  v.cx = Math.min(BOUNDS.x1, Math.max(BOUNDS.x0, v.cx));
  v.cy = Math.min(BOUNDS.y1, Math.max(BOUNDS.y0, v.cy));
  return v;
}
function applyView(){
  clampView(view);
  const h = vhOf();
  svg.setAttribute('viewBox', `${(view.cx - view.w / 2).toFixed(2)} ${(view.cy - h / 2).toFixed(2)} ${view.w.toFixed(2)} ${h.toFixed(2)}`);
  svg.classList.toggle('zoomed', scaleOf() >= 2.2);
}
let tweenId = 0;
function tweenTo(t, ms){
  clampView(t);
  const s = {...view}, t0 = performance.now(), id = ++tweenId;
  if (!ms){ view = t; applyView(); return; }
  const step = now => {
    if (id !== tweenId) return;
    let k = Math.min(1, (now - t0) / ms); k = 1 - Math.pow(1 - k, 3);
    // 폭은 로그 보간(확대/축소 체감 균일)
    view = {cx:s.cx + (t.cx - s.cx) * k, cy:s.cy + (t.cy - s.cy) * k, w:Math.exp(Math.log(s.w) + (Math.log(t.w) - Math.log(s.w)) * k)};
    applyView();

  };
  requestAnimationFrame(step);
}
function fitBox(x0, y0, x1, y1, pad, maxScale){
  const bw = x1 - x0 + pad * 2, bh = y1 - y0 + pad * 2;
  let sc = Math.min(W / bw, H / bh);
  if (maxScale) sc = Math.min(sc, maxScale);
  return {cx:(x0 + x1) / 2, cy:(y0 + y1) / 2, w:W / sc, _sc:sc};
}

function goZone(z){
  let a = 1e9, b = -1e9, c = 1e9, d = -1e9;
  for (const k in BOOTHS){ const v = BOOTHS[k]; if (v.z === z || (z === 'P' && v.z === 'L')){ a = Math.min(a, v.x); b = Math.max(b, v.x + v.w); c = Math.min(c, v.y); d = Math.max(d, v.y + v.h); } }
  const t = fitBox(a, Math.max(c - 30, BOUNDS.y0), b, d + 40, 6);
  tweenTo(t, 450);
}
function zoomAt(f, px, py, ms){
  const sc = scaleOf(), ux = view.cx + (px - W / 2) / sc, uy = view.cy + (py - H / 2) / sc;
  const nw = Math.min(Math.max(view.w / f, W / 11), Math.max((BOUNDS.x1 - BOUNDS.x0) * 1.08, (BOUNDS.y1 - BOUNDS.y0) * 1.08 * W / H));
  const nsc = W / nw;
  const t = {cx:ux - (px - W / 2) / nsc, cy:uy - (py - H / 2) / nsc, w:nw};
  tweenTo(t, ms || 0);
}
function zoomBy(f){ zoomAt(f, W / 2, H / 2, 200); }

/* 포인터 제스처: 드래그 이동, 핀치 줌, 휠 줌, 탭 선택 */
const ptrs = new Map();
let gesture = null, tapTarget = null, moved = false, startXY = null;
wrap.addEventListener('pointerdown', e => {
  if (e.target.closest('.map-btns')) return;
  wrap.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  tweenId++;
  if (ptrs.size === 1){ moved = false; startXY = {x:e.clientX, y:e.clientY}; tapTarget = e.target.closest ? e.target.closest('.b') : null; }
  else { moved = true; tapTarget = null; }
  gesture = null; wrap.classList.add('drag'); hideHint();
});
wrap.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const r = wrap.getBoundingClientRect();
  if (ptrs.size === 1){
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    if (!moved && Math.hypot(e.clientX - startXY.x, e.clientY - startXY.y) > 7) moved = true;
    if (moved){ const sc = scaleOf(); view.cx -= dx / sc; view.cy -= dy / sc; applyView(); }
    p.x = e.clientX; p.y = e.clientY;
  } else if (ptrs.size === 2){
    p.x = e.clientX; p.y = e.clientY;
    const [a, b] = [...ptrs.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2 - r.left, my = (a.y + b.y) / 2 - r.top;
    if (gesture){
      if (dist > 0 && gesture.dist > 0){
        const sc0 = scaleOf(), ux = view.cx + (gesture.mx - W / 2) / sc0, uy = view.cy + (gesture.my - H / 2) / sc0;
        view.w = view.w * gesture.dist / dist; clampView(view);
        const sc1 = scaleOf();
        view.cx = ux - (mx - W / 2) / sc1; view.cy = uy - (my - H / 2) / sc1;   // 핀치 중심 고정 + 두 손가락 이동 반영
        applyView();
      }
    }
    gesture = {dist, mx, my};
  }
});
function endPtr(e){
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (ptrs.size === 0){
    wrap.classList.remove('drag');
    if (!moved && tapTarget && e.type === 'pointerup') select(tapTarget.getAttribute('data-c'));
    tapTarget = null;
  }
  gesture = null;
  if (ptrs.size === 1){ const q = [...ptrs.values()][0]; startXY = {x:q.x, y:q.y}; }
}
wrap.addEventListener('pointerup', endPtr);
wrap.addEventListener('pointercancel', endPtr);
wrap.addEventListener('wheel', e => {
  e.preventDefault(); tweenId++;
  const r = wrap.getBoundingClientRect();
  zoomAt(Math.exp(-e.deltaY * 0.0016), e.clientX - r.left, e.clientY - r.top, 0);
  hideHint();
}, {passive:false});

/* ---------- 부스 선택 / 하이라이트 / 경로 ---------- */
let sel = null, routeMode = 'auto', lastFocus = 'focus';
function routeBox(b){
  const pts = b.r.p;
  let x0 = b.x, y0 = b.y, x1 = b.x + b.w, y1 = b.y + b.h;
  pts.forEach(p => { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); });
  return [x0, y0, x1, y1];
}
function tailBox(b, len){
  // 경로의 끝(부스 쪽)에서 거꾸로 len 만큼의 구간 + 부스
  const pts = b.r.p; let x0 = b.x, y0 = b.y, x1 = b.x + b.w, y1 = b.y + b.h, acc = 0;
  let prev = pts[pts.length - 1];
  const add = p => { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); };
  add(prev);
  for (let i = pts.length - 2; i >= 0 && acc < len; i--){
    const p = pts[i], seg = Math.abs(p[0] - prev[0]) + Math.abs(p[1] - prev[1]);
    if (acc + seg > len){ const k = (len - acc) / seg; add([prev[0] + (p[0] - prev[0]) * k, prev[1] + (p[1] - prev[1]) * k]); acc = len; break; }
    add(p); acc += seg; prev = p;
  }
  return [x0, y0, x1, y1];
}
function focusSel(mode, ms){
  const b = BOOTHS[sel]; if (!b) return;
  readSize();   // 하단 안내 패널 높이가 바뀐 직후의 실제 지도 영역 크기로 계산
  const PAD = 16, MAXSC = 6.5;
  const bx = routeBox(b);
  const full = fitBox(bx[0], bx[1], bx[2], bx[3], PAD, MAXSC);
  let t, used;
  if (mode === 'full'){ t = full; used = 'full'; }
  else if (full._sc >= 1.5){ t = full; used = 'full'; }          // 경로 전체가 읽을 만한 크기로 들어오면 전체
  else {                                                          // 아니면 부스 주변 + 경로 끝부분
    const tb = tailBox(b, 150);
    t = fitBox(tb[0], tb[1], tb[2], tb[3], PAD, Math.min(MAXSC, W / 96));
    used = 'focus';
  }
  lastFocus = used;
  tweenTo({cx:t.cx, cy:t.cy, w:t.w}, ms === undefined ? 650 : ms);
  renderSheet();
}
function select(code, opts){
  opts = opts || {};
  if (!BOOTHS[code]) return false;
  sel = code;
  const b = BOOTHS[code];
  const pts = b.r.p;
  $('routeLayer').innerHTML =
    `<polyline class="route-case" points="${pts.map(p => p.join(',')).join(' ')}"/>`
    + `<polyline class="route-line" marker-end="url(#arr)" points="${pts.map(p => p.join(',')).join(' ')}"/>`
    + `<polyline class="route-flow" points="${pts.map(p => p.join(',')).join(' ')}"/>`
    + `<circle class="start-dot" cx="${pts[0][0]}" cy="${pts[0][1]}" r="3.4"/>`;
  $('selLayer').innerHTML = shapeEl(b, 'sel-fill') + shapeEl(b, 'sel-ring');
  document.querySelectorAll('.ent').forEach(el => el.classList.remove('sel'));
  const en = $('ent' + (b.r.e + 1)); if (en) en.classList.add('sel');
  try { history.replaceState(null, '', location.pathname + '?booth=' + encodeURIComponent(code)); } catch (e) {}
  hideHint(); hideSugg();
  renderSheet();
  requestAnimationFrame(() => focusSel('auto', opts.instant ? 0 : 650));
  return true;
}
function clearSel(){
  sel = null; $('routeLayer').innerHTML = ''; $('selLayer').innerHTML = '';
  document.querySelectorAll('.ent').forEach(el => el.classList.remove('sel'));
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  renderSheet();
}
function renderSheet(){
  const el = $('sheet');
  if (!sel){
    el.innerHTML = `<div class="idle"><b>부스를 눌러 위치와 가는 길을 확인하세요.</b><br>위 검색창에 부스번호나 업체명을 입력해도 됩니다.</div>`
      + `<div class="links"><a href="${DIR_URL.P}">소재부품산업전 참가업체</a><a href="${DIR_URL.D}">자동화기기전 참가업체</a></div>`;
    return;
  }
  const b = BOOTHS[sel];
  const names = b.n.map(x => x[0]).filter(Boolean);
  const ens = b.n.map(x => x[1]).filter(Boolean);
  const zl = DIR_URL[b.z] ? `<a href="${DIR_URL[b.z]}">참가업체 목록</a>` : '';
  const toggle = lastFocus === 'full' ? ['부스 확대', 'focus'] : ['경로 전체 보기', 'full'];
  el.innerHTML = `<div class="sh-top"><span class="zbadge ${b.z}">${esc(sel)}</span>`
    + `<div class="sh-name"><b>${esc(names.join(' / ') || sel)}</b>${ens.length ? `<small>${esc(ens.join(' / '))}</small>` : ''}</div>`
    + `<button class="sh-x" type="button" onclick="goAll()" aria-label="닫기">×</button></div>`
    + `<div class="sh-route">출입구 ${b.r.e + 1}에서 가는 길 <span>(${esc(ZONE_NAME[b.z])})</span></div>`
    + `<div class="links"><button type="button" class="primary" onclick="focusSel('${toggle[1]}')">${toggle[0]}</button>${zl}</div>`
    + `<div class="note">안내선은 통로를 따라 계산한 간이 경로입니다. 현장 안내 표지를 함께 확인해 주세요.</div>`;
}

/* ---------- 검색 ---------- */
const INDEX = Object.keys(BOOTHS).map(c => ({c, ko:BOOTHS[c].n.map(x => x[0]).join(' / '), en:BOOTHS[c].n.map(x => x[1]).join(' / '), z:BOOTHS[c].z}));
const norm = s => String(s || '').toLowerCase().replace(/[\s\-_]/g, '');
function hideSugg(){ $('sugg').style.display = 'none'; }
function showSugg(){
  const q = norm($('q').value);
  $('qclear').style.display = q ? 'block' : 'none';
  if (!q){ hideSugg(); return; }
  const list = INDEX.filter(it => norm(it.c).includes(q) || norm(it.ko).includes(q) || norm(it.en).includes(q))
    .sort((a, b) => (norm(a.c).startsWith(q) ? 0 : 1) - (norm(b.c).startsWith(q) ? 0 : 1) || a.c.localeCompare(b.c, 'en', {numeric:true})).slice(0, 8);
  const s = $('sugg');
  s.innerHTML = list.length ? list.map(it => `<button type="button" data-c="${it.c}"><span class="zbadge ${it.z}">${it.c}</span><span class="sn">${esc(it.ko)}</span></button>`).join('')
    : `<button type="button" disabled style="color:#9ca3af">검색 결과가 없습니다</button>`;
  s.style.display = 'block';
}
$('q').addEventListener('input', showSugg);
$('q').addEventListener('keydown', e => {
  if (e.key === 'Enter'){ const f = $('sugg').querySelector('button[data-c]'); if (f){ select(f.dataset.c); $('q').blur(); } }
});
$('sugg').addEventListener('click', e => { const b = e.target.closest('button[data-c]'); if (b){ select(b.dataset.c); $('q').blur(); } });
$('qclear').addEventListener('click', () => { $('q').value = ''; hideSugg(); $('qclear').style.display = 'none'; });
document.addEventListener('pointerdown', e => { if (!e.target.closest('.search-wrap')) hideSugg(); });

/* ---------- 기타 ---------- */
function hideHint(){ $('hint').classList.add('off'); }
function toast(msg){ const t = $('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => { t.style.display = 'none'; }, 3200); }
function paramBooth(){
  let v = new URLSearchParams(location.search).get('booth') || decodeURIComponent((location.hash || '').replace(/^#/, ''));
  v = String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  return v;
}
let inited = false;
function readSize(){ const r = wrap.getBoundingClientRect(); W = Math.max(1, r.width); H = Math.max(1, r.height); }
function init(){
  buildMap(); renderSheet();
  const code = paramBooth();
  view = {cx:(BOUNDS.x0 + BOUNDS.x1) / 2, cy:(BOUNDS.y0 + BOUNDS.y1) / 2, w:BOUNDS.x1 - BOUNDS.x0};
  applyView();
  if (code){
    if (BOOTHS[code]) select(code, {instant:true});
    else toast('부스번호 ' + code + '을(를) 찾을 수 없습니다. 전체 배치도를 표시합니다.');
  }
  setTimeout(hideHint, 6000);
}
new ResizeObserver(() => {
  readSize();
  if (!inited){ inited = true; init(); }
  else { applyView(); if (sel) { /* 크기 변경 시 현재 보기 유지 */ } }
}).observe(wrap);
window.addEventListener('popstate', () => { const c = paramBooth(); if (c && BOOTHS[c]) select(c); });
</script>
