function toast(m){var t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);}
  t.textContent=m;t.className='on';clearTimeout(t._h);t._h=setTimeout(function(){t.className='';},2600);}
function ask(a){var v=a.getAttribute('data-v'),label=a.getAttribute('data-l');
  function done(){toast(label+'를 복사했습니다: '+v);}

function share(url,title){
  if(navigator.share){navigator.share({title:title,url:url}).catch(function(){});return;}
